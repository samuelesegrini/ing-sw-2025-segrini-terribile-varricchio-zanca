name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '23' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # verify runs compile, the test suite and the JaCoCo report in one pass.
      - name: Build, test and measure coverage
        # Under a virtual display, because the graphical client's tests build real JavaFX
        # windows. Without one they skip, and six tests that quietly do nothing on the only
        # machine anybody checks look exactly like six tests that pass.
        run: xvfb-run -a ./mvnw -B -ntp clean verify

      # Printed rather than uploaded: artifact storage is a shared account quota,
      # and a number in the log is what a reviewer actually reads.
      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No coverage report was produced."
            exit 0
          fi
          awk -F, 'NR > 1 {
            missed += $4; covered += $5;
            branchMissed += $6; branchCovered += $7
          }
          END {
            total = missed + covered
            branchTotal = branchMissed + branchCovered
            printf "Instruction coverage: %.1f%% (%d/%d)\n",
                   total ? covered * 100 / total : 0, covered, total
            printf "Branch coverage:      %.1f%% (%d/%d)\n",
                   branchTotal ? branchCovered * 100 / branchTotal : 0, branchCovered, branchTotal
          }' "$CSV" | tee -a "$GITHUB_STEP_SUMMARY"

  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: temurin
          cache: maven
      # doclint is fatal, so this fails on missing or malformed documentation.
      - name: Generate Javadoc
        run: ./mvnw -B -ntp javadoc:javadoc
